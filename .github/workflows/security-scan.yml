name: Security scan
# Report-only org security scan. NEVER blocks a push or a merge.
#
# Do not edit this file in place. It is a byte-copy of:
#   https://github.com/mightyandtrue/mt-security/blob/main/callers/default.yml
# Why the triggers and concurrency look like this, and how to change them:
#   https://github.com/mightyandtrue/mt-security/blob/main/docs/runbooks/security-scan-callers.md
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: security-scan-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  security:
    uses: mightyandtrue/mt-security/.github/workflows/security.yml@v1
    permissions:
      contents: read
    with:
      profile: default
